name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed --name "CD-Factu" --add-data "assets;assets" --add-data "app/db/schema.sql;app/db" main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CD-Factu-Windows
          path: dist/CD-Factu.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libfuse2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Linux AppImage
        run: bash build-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CD-Factu-Linux
          path: CD-Factu-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CD-Factu-Windows/CD-Factu.exe
            artifacts/CD-Factu-Linux/CD-Factu-x86_64.AppImage
          tag_name: ${{ github.ref_name }}
          name: CD Factu ${{ github.ref_name }}
